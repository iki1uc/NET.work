// USER_READY — erzeugt ein TMP-geführtes User-Atom

export function USER_READY(name = "unknown-user"){

    return {
        id: crypto.randomUUID(),
        user: name,
        status: "READY",
        axis: 9,
        contact: "TP9",
        time: Date.now(),
        legal: "EU-DSGVO",
        atom: "USER"
    };
}
