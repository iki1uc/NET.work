<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>ORT · axiomische Naturwahrheit</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background:#0a0a12;
      color:#e8edf5;
      font-family:Inter, sans-serif;
      padding:40px;
    }
    .ort-box {
      padding:28px;
      border:1px solid #333;
      border-radius:16px;
      background:#131a24;
      box-shadow:0 0 22px rgba(0,0,0,0.4);
    }
    h2 { margin-bottom:10px; }
    .axiom { color:#4dd0e1; font-weight:700; }
    .line { margin-top:12px; font-size:15px; }
  </style>
</head>

<body>

<div class="ort-box">
  <h2>ORT.net</h2>
  <p class="axiom">Axiomische Naturwahrheit · Reinraum · Fixpunkt</p>

  <div class="line">LAN beginnt hier.</div>
  <div class="line">WLAN öffnet sich hier.</div>
  <div class="line">myLAN erkennt sich hier.</div>
  <div class="line">NET ordnet sich hier.</div>
  <div class="line">WORK entsteht hier.</div>
  <div class="line">ZOLL spricht hier.</div>
  <div class="line">EVO bildet sich hier.</div>

  <p style="margin-top:20px;">ORT ist die Mitte deiner Welt.</p>
</div>

<script>
  const ORT = {
    axiom() { console.log("ORT → Axiomische Naturwahrheit aktiv"); },
    lan() { console.log("ORT → LAN beginnt"); },
    wlan() { console.log("ORT → WLAN öffnet sich"); },
    mylan() { console.log("ORT → myLAN erkennt sich"); },
    net() { console.log("ORT → NET ordnet sich"); },
    work() { console.log("ORT → WORK entsteht"); },
    zoll() { console.log("ORT → ZOLL spricht"); },
    evo() { console.log("ORT → EVO bildet sich"); }
  };

  ORT.axiom();
  ORT.lan();
  ORT.wlan();
  ORT.mylan();
  ORT.net();
  ORT.work();
  ORT.zoll();
  ORT.evo();
</script>

</body>
</html>
