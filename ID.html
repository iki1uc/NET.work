<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ID · ELEKTRON · LEBEN</title>

<style>
body {
    background:#000;
    color:#0f0;
    font-family:Consolas;
    padding:40px;
    text-align:center;
}

/* Elektron-Kreis */
#elektron {
    width:240px;
    height:240px;
    margin:auto;
    position:relative;
    border:3px solid #0f0;
    border-radius:50%;
    animation: pulse 4s infinite ease-in-out;
}

/* Achsen */
.axis {
    position:absolute;
    background:#0f0;
    opacity:0.7;
}

/* Vertikal */
#v { width:3px; height:240px; left:50%; top:0; transform:translateX(-50%); }

/* Horizontal */
#h { width:240px; height:3px; top:50%; left:0; transform:translateY(-50%); }

/* Diagonalen */
#d1 { width:3px; height:240px; left:50%; top:0; transform:translateX(-50%) rotate(45deg); }
#d2 { width:3px; height:240px; left:50%; top:0; transform:translateX(-50%) rotate(-45deg); }

/* Kern */
#core {
    position:absolute;
    width:50px;
    height:50px;
    background:#111;
    border:3px solid #f00;
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#f00;
    font-size:22px;
    animation: spin 6s infinite linear;
}

/* Lebenspunkte */
.point {
    position:absolute;
    color:#0f0;
    font-size:20px;
    animation: orbit 9s infinite linear;
}

/* Positionen */
.p3  { top:10%; left:50%; transform:translateX(-50%); }
.p9  { top:50%; left:90%; transform:translateY(-50%); }
.p81 { top:90%; left:50%; transform:translateX(-50%); }
.p27 { top:50%; left:10%; transform:translateY(-50%); }

/* Animationen */
@keyframes pulse {
    0% { box-shadow:0 0 10px #0f0; }
    50% { box-shadow:0 0 25px #0f0; }
    100% { box-shadow:0 0 10px #0f0; }
}

@keyframes spin {
    from { transform:translate(-50%, -50%) rotate(0deg); }
    to   { transform:translate(-50%, -50%) rotate(360deg); }
}

@keyframes orbit {
    from { transform:rotate(0deg); }
    to   { transform:rotate(360deg); }
}
</style>
</head>

<body>

<h1>ID · ELEKTRON · LEBEN</h1>

<div id="elektron">
    <div id="v" class="axis"></div>
    <div id="h" class="axis"></div>
    <div id="d1" class="axis"></div>
    <div id="d2" class="axis"></div>

    <div id="core">−</div>

    <div class="point p3">3</div>
    <div class="point p9">9</div>
    <div class="point p81">81</div>
    <div class="point p27">27</div>
</div>
