<body>
  <div class="ok">
    <h2>NET.load</h2>
    <p>Alle Module geladen.</p>

<script>
  // NET.load → verbindet alles
  const NET = {
    core: OS_CORE,
    axiom: AXIOM,
    nc: {
      figur: NC_figur,
      kraft: NC_kraft,
      space: NC_space,
      time: NC_time
    },
    geo: { coord, dreieck, vec, vec3, vec9 },
    flow: { resolver, router, respo },
    domain: { MOVE, KOOP, WETTER, SOCCER },
    user: { ID, USER, USE },
    zoll: ZOLL,

    ready() {
      console.log("NET.ready → OK");
      document.body.innerHTML += "<p style='color:#2ed98c'>NET.ready()</p>";
    }
  };

  NET.ready();
</script>
