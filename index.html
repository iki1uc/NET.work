<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATOM · NET.work · Live</title>

<style>
  body {
    margin:0; padding:0;
    background:#0a0a12;
    color:#e8edf5;
    font-family:Inter, sans-serif;
  }
  #root {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:20px;
  }
  .panel {
    background:#131a24;
    border:1px solid #1e2a3a;
    border-radius:12px;
    padding:16px;
  }
  h2 {
    margin:0 0 12px 0;
    font-size:18px;
    color:#ffd700;
  }
  canvas {
    width:100%; height:300px;
    background:#0e141c;
    border-radius:8px;
  }
  .btn {
    background:#ffd700;
    color:#000;
    padding:10px 16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    margin-right:8px;
  }
  .btn:hover { opacity:0.85; }
  #log {
    max-height:200px;
    overflow-y:auto;
    font-size:12px;
    background:#0e141c;
    padding:10px;
    border-radius:8px;
  }
</style>
</head>

<body>

<div id="root">

  <!-- NC-Figur -->
  <div class="panel">
    <h2>NC · Figur</h2>
    <canvas id="figurCanvas"></canvas>
  </div>

  <!-- RESPO-Mesh -->
  <div class="panel">
    <h2>RESPO · Mesh</h2>
    <canvas id="meshCanvas"></canvas>
  </div>

  <!-- Router -->
  <div class="panel">
    <h2>Router</h2>
    <button class="btn" id="btnHome">Home</button>
    <button class="btn" id="btnAxiom">Axiom</button>
    <button class="btn" id="btnUser">User</button>
    <button class="btn" id="btnNet">Net</button>
    <div id="routeOut" style="margin-top:12px;font-size:14px;color:#9aa8c0;">
      Route: /home
    </div>
  </div>

  <!-- Log -->
  <div class="panel">
    <h2>ATOM · Log</h2>
    <div id="log"></div>
  </div>

</div>

<script>
/* ============================================================
   ATOM · NC · RESPO · ROUTER · LIVE
   ============================================================ */

const logEl = document.getElementById("log");
function log(msg){
  const t = new Date().toLocaleTimeString();
  logEl.innerHTML += `<div>[${t}] ${msg}</div>`;
  logEl.scrollTop = logEl.scrollHeight;
}

/* ---------------- NC-Figur ---------------- */
const figurCanvas = document.getElementById("figurCanvas");
const fctx = figurCanvas.getContext("2d");

function drawFigur(){
  fctx.clearRect(0,0,figurCanvas.width,figurCanvas.height);
  fctx.fillStyle="#ffd700";
  fctx.beginPath();
  fctx.arc(150,150,40,0,Math.PI*2);
  fctx.fill();
  log("NC-Figur aktualisiert");
}

/* ---------------- RESPO-Mesh ---------------- */
const meshCanvas = document.getElementById("meshCanvas");
const mctx = meshCanvas.getContext("2d");

function drawMesh(){
  mctx.clearRect(0,0,meshCanvas.width,meshCanvas.height);
  mctx.strokeStyle="#4dd0e1";
  for(let x=20;x<meshCanvas.width;x+=40){
    for(let y=20;y<meshCanvas.height;y+=40){
      mctx.strokeRect(x,y,30,30);
    }
  }
  log("RESPO-Mesh aktualisiert");
}

/* ---------------- Router ---------------- */
const routeOut = document.getElementById("routeOut");
function route(path){
  routeOut.textContent = "Route: " + path;
  log("Router → " + path);
}

document.getElementById("btnHome").onclick = ()=>route("/home");
document.getElementById("btnAxiom").onclick = ()=>route("/axiom");
document.getElementById("btnUser").onclick = ()=>route("/user");
document.getElementById("btnNet").onclick = ()=>route("/net");

/* ---------------- INIT ---------------- */
function init(){
  drawFigur();
  drawMesh();
  log("ATOM · index.html geladen");
}
init();

</script>
</body>
</html>
